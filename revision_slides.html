  response: {
    'AE': {
      en: `<div class="card q"><div class="card-label">OUR POSITION</div>We thank the AE for a clear, prioritized review and we <strong>agree</strong> with every one of the five axes raised. The original submission overclaimed in two specific ways: (i) parameter choices presented as settled without exposing selection logic, and (ii) Abstract/Introduction wording implied a deployment-ready system. Both are corrected. Where the AE asks for "deployment feasibility under more realistic sensing and cutting conditions," we acknowledge that real-machine validation is not within our research infrastructure and we reinterpret the request as <strong>operating-envelope characterization</strong>, argued openly in the new Discussion §6.2.</div>
        <p><strong>How the five axes are addressed in the revised manuscript:</strong></p>
        <ul>
          <li><strong>AE-1.</strong> Every swept hyperparameter is now paired with one criterion decided <em>before</em> consulting success. New §5.1.6 "Parameter selection rationale" walks through this logic for ω, <code>ucb_lb</code>, <code>ucb_beta</code>, <code>sampling_timesteps</code>, voxel resolution, <code>task_step</code> (Table 4).</li>

          <li><strong>AE-5.</strong> Abstract, Introduction contributions, and Conclusion rewritten with simulation-scoped verbs. §6.4 Limitation acknowledges real-machine integration as a natural extension that is <em>not required</em> for the claimed contributions.</li>
        </ul>
        <div class="card a"><div class="card-label">WHY SUFFICIENT</div>The revised contribution is a planning-and-analysis framework characterized along four axes — parameter sensitivity, empirical convergence, fair comparison, and operating envelope under controlled corruption — with claims scoped accordingly. This matches venue convention in TAMP, MPC, and disassembly-sequence-planning, where algorithmic contributions are evaluated in simulation and physical deployment is the subject of follow-on systems work. The operating-envelope characterization gives integrators the specification surface needed to compose their own perception and cutting modules around our planner.</div>
        <p class="lead">Cross-reference: §4.5 (feature_provider) · §5.1 (audit) · §5.1.6 (param rationale) · §5.3 (convergence) · §5.4 (robustness) · §5.5 (safety) · §5.7 (VAEAC) · §5.8 (DDIM) · §5.9 (OOD) · §6.2 (Scope of Evaluation) · §6.3 (spec surface) · §6.4 (Limitation).</p>`,
      jp: `<div class="card q"><div class="card-label">本論文の立場</div>明確で優先順位の付けられた審査をいただいたことに感謝します。指摘された5軸すべてに<strong>同意</strong>します。原稿には2点で過剰な主張がありました：(i) パラメータ選択が選択ロジックを明示せず確定事項として提示、(ii) Abstract/Introduction の文言がデプロイ可能なシステムを示唆。両者を修正しました。「より現実的なセンシング・切断条件下での deployment feasibility」については、実機検証が研究インフラの範囲外であることを認め、要請を<strong>operating-envelope characterization</strong>として再解釈し、新規 Discussion §6.2 にて公明に論じます。</div>
        <p><strong>改訂稿における5軸への対応：</strong></p>
        <ul>
          <li><strong>AE-1.</strong> 各スイープハイパーパラメータに、成功率確認<em>前</em>に決定された基準を1つずつ対応付け。新規 §5.1.6「Parameter selection rationale」にて ω, <code>ucb_lb</code>, <code>ucb_beta</code>, <code>sampling_timesteps</code>, ボクセル解像度, <code>task_step</code> の論理を提示（Table 4）。</li>
          <li><strong>AE-2.</strong> 経験的診断を未切断サブボリュームに限定（§5.3）、校正済み停止規則を保留テストエピソードに実適用（Table 5）。理論的主張なし。</li>
          <li><strong>AE-3.</strong> ベースライン・バジェット監査表（§5.1, Table 2）。VAEAC を matched compute で再訓練（§5.7, Table 6）。</li>
          <li><strong>AE-4.</strong> <strong>5 つの artifact</strong> で operating envelope を特徴付け：§5.4（マスクドメインノイズ予算）、§5.5（最悪ケース + CVaR 安全性）、§5.8（DDIM 速度–品質パレート）、§4.5（<code>feature_provider</code> 抽象化）、§5.9（外部メッシュ OOD による幾何学的 envelope、色セマンティクス継承を明示）。§6.2 でシミュレーション充足性を論じる。</li>

let state = { lang: 'en', idx: 0 };
const elItemId = document.getElementById('itemId');
const elItemLabel = document.getElementById('itemLabel');
const progressLabel = document.getElementById('progressLabel');
const progressBar = document.getElementById('progressBar');
const indexChips = document.getElementById('indexChips');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const bodyComments = document.getElementById('bodyComments');
const bodyResponse = document.getElementById('bodyResponse');
const bodyStrategy = document.getElementById('bodyStrategy');
const hdrComments = document.getElementById('hdrComments');
const hdrResponse = document.getElementById('hdrResponse');
const hdrStrategy = document.getElementById('hdrStrategy');

function buildIndexChips() {
  indexChips.innerHTML = '';
  ITEMS.forEach((it, i) => {
    const b = document.createElement('button');
    b.textContent = it.id === 'AE' ? 'AE' : it.id.replace('R3-', '');
    b.title = it.label[state.lang];
    b.onclick = () => { state.idx = i; render(); };
    indexChips.appendChild(b);
  });
}

function render() {
  const item = ITEMS[state.idx];
  elItemId.textContent = item.id;
  elItemLabel.textContent = item.label[state.lang];
  bodyComments.innerHTML = CONTENT.comments[item.id][state.lang];
  bodyResponse.innerHTML = CONTENT.response[item.id][state.lang];
  bodyStrategy.innerHTML = CONTENT.strategy[item.id][state.lang];
  bodyComments.scrollTop = 0;
  bodyResponse.scrollTop = 0;
  bodyStrategy.scrollTop = 0;

  const total = ITEMS.length;
  progressLabel.textContent = `${state.idx + 1} / ${total}`;
  progressBar.style.width = `${((state.idx + 1) / total) * 100}%`;

  hdrComments.textContent = SUBTITLES[state.lang].c;
  hdrResponse.textContent = SUBTITLES[state.lang].r;
  hdrStrategy.textContent = SUBTITLES[state.lang].s;

  Array.from(indexChips.children).forEach((c, i) => {
    c.classList.toggle('active', i === state.idx);
    c.title = ITEMS[i].label[state.lang];
  });
  prevBtn.disabled = state.idx === 0;
  nextBtn.disabled = state.idx === total - 1;

  document.querySelectorAll('#langNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === state.lang);
  });
}

document.getElementById('langNav').addEventListener('click', e => {
  if (e.target.dataset.lang) { state.lang = e.target.dataset.lang; render(); }
});
prevBtn.onclick = () => { if (state.idx > 0) { state.idx--; render(); } };
nextBtn.onclick = () => { if (state.idx < ITEMS.length - 1) { state.idx++; render(); } };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft' && state.idx > 0) { state.idx--; render(); }
  else if (e.key === 'ArrowRight' && state.idx < ITEMS.length - 1) { state.idx++; render(); }
  else if (e.key === 'l' || e.key === 'L') { state.lang = state.lang === 'en' ? 'jp' : 'en'; render(); }
});

buildIndexChips();
render();
</script>
