# SheetSander 追加評価 (Proposed-GT): Object F (type2) の10ケース
# Proposed (complex_sheetsander_v1_F) との違いは control.mode だけ。
# oracle_obs モードでは、拡散モデルの予測の代わりに正解の内部構造を M 枚並べて判断する。
# 結果はランのフォルダの下の oracle_obs/ に保存される (Proposed は epsilon_greedy_00/)。

defaults:
  - complex_sheetsander_v1_common
  - /eval/common/cases@cases: complex_eval_v1_F
  - _self_

policy:
  control:
    mode: oracle_obs
