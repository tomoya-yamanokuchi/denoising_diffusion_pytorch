# 評価結果のルートディレクトリ。
# tags が指定されている場合は root_folder / tag を読む。
root_folder: /home/dev/workspace/dataset/nedo_dismantling_log/eval/unet_D64_T1000_S20_simple_20260504_160530/simple_T8_N6_E60000

# 文字列でもリストでもOKにする。
# tags: epsilon_greedy_00
tags:
  - epsilon_greedy_00

# 出力名
save_prefix: no_axis_w_cutting_plane3
save_subdir: 3d_cutting_process

# 入力ファイル名
rollout_filename   : rollout_data.pickle
oracle_obs_filename: oracle_obs_cast_z_axis0.png

# レンダリング解像度
dim_2d: 64
dim_3d: 16

# voxel grid 設定
bounds: [-0.05, 0.05, -0.05, 0.05, -0.05, 0.05]

# 処理対象の制御
# null の場合は全部。
model_type_indices: null

# null なら max_episodes を使う。
episode_indices: null

# まずは従来挙動に合わせて1 episodeだけ。
max_episodes: 1

# paper用の偶数/奇数フレーム複製処理を使うか
paper_frame_interleave: true

ray:
  enabled           : true
  log_to_driver     : false
  num_cpus          : 4
  max_in_flight     : 4
  shutdown_on_finish: true

renderer:
  use_ray : true
  save_eps: true
