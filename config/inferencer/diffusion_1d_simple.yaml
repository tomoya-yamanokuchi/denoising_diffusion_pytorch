defaults:
  # - /watch/train: diffusion_1d
  - network: unet1d_D64
  - _self_

name     : diffusion_1d
USER_NAME: user

diffusion:
  beta_schedule     : sigmoid
  timesteps         : 1000
  sampling_timesteps: 20

trainer:
  train_batch_size         : 96
  train_lr                 : 8e-5
  train_num_steps          : 100000
  save_and_sample_every    : 5000
  gradient_accumulate_every: 2
  ema_decay                : 0.995
  amp                      : true
